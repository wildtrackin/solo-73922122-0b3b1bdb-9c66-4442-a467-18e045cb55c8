# Alarm gateway + dual collectors, all sharing one directory and one DB.
#
#   docker compose up --build
#   open http://localhost:8000
#
services:
  web:
    build: .
    image: alarm-ingest:latest
    command: ["web"]
    environment:
      SHARED_DIR: /data/shared
      DB_PATH: /data/warehouse/alarms.db
      MAX_GENERATIONS: "3"
    ports:
      - "8000:8000"
    volumes:
      - shared_data:/data/shared
      - db_data:/data/warehouse
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/healthz', timeout=3).status==200 else 1)"]
      interval: 10s
      timeout: 4s
      retries: 5
    restart: unless-stopped

  collector-a:
    image: alarm-ingest:latest
    command: ["collector"]
    environment:
      SHARED_DIR: /data/shared
      DB_PATH: /data/warehouse/alarms.db
      COLLECTOR_ID: collector-a
      SCAN_INTERVAL: "0.5"
    volumes:
      - shared_data:/data/shared
      - db_data:/data/warehouse
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped

  collector-b:
    image: alarm-ingest:latest
    command: ["collector"]
    environment:
      SHARED_DIR: /data/shared
      DB_PATH: /data/warehouse/alarms.db
      COLLECTOR_ID: collector-b
      SCAN_INTERVAL: "0.5"
    volumes:
      - shared_data:/data/shared
      - db_data:/data/warehouse
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped

volumes:
  shared_data:
  db_data:
